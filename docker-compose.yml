version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crosspath
      POSTGRES_USER: crosspath_app
      POSTGRES_PASSWORD: crosspath_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspath_app -d crosspath"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/crosspath
      DB_USER: crosspath_app
      DB_PASSWORD: crosspath_app
      DB_MIGRATION_USER: crosspath_app
      DB_MIGRATION_PASSWORD: crosspath_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: