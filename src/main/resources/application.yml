server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  tomcat:
    accesslog:
      enabled: false

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crosspath}
    username: ${DB_USER:crosspath_app}
    password: ${DB_PASSWORD:crosspath_app}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:4}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRATION_USER:${DB_USER:crosspath_app}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:crosspath_app}}
    schemas: public
    baseline-on-migrate: false

app:
  rate-limit:
    # SPEC §4 の環境変数名で上書き可能にする
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-ip-per-minute: ${RATE_LIMIT_PER_IP_PER_MINUTE:10}
    per-ip-burst: ${RATE_LIMIT_PER_IP_BURST:20}
    new-registrations-per-second: ${RATE_LIMIT_NEW_REGISTRATIONS_PER_SECOND:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%mdc{traceId}] - %msg%n"